
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - CodeAlpha E-Commerce Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .checkout-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .checkout-box h3 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .order-item-name {
            font-weight: bold;
        }

        .order-total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .place-order-button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .place-order-button:hover {
            background: #444;
        }

        @media (max-width: 700px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>CodeAlpha E-Commerce Store</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="login.html">Login</a>
        </nav>

    </header>

    <main>

        <h2>Checkout</h2>

        <div class="checkout-container">

            <div class="checkout-box">

                <h3>Customer Details</h3>

                <form id="checkout-form">

                    <div class="form-group">
                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="address">
                            Address
                        </label>

                        <textarea
                            id="address"
                            required
                        ></textarea>
                    </div>

                    <button
                        type="submit"
                        class="place-order-button"
                    >
                        Place Order
                    </button>

                </form>

            </div>


            <div class="checkout-box">

                <h3>Order Summary</h3>

                <div id="order-summary"></div>

                <div
                    id="order-total"
                    class="order-total"
                >
                    Total: ₹0.00
                </div>

            </div>

        </div>

    </main>


    <script>
        
        const user =
    JSON.parse(
        localStorage.getItem("user")
    );

if (!user) {

    alert("Please login before checkout.");

    window.location.href =
        "login.html";

}

        function getCart() {

            return JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        }


        function displayOrderSummary() {

            const cart = getCart();

            const summary =
                document.getElementById("order-summary");

            const totalElement =
                document.getElementById("order-total");

            summary.innerHTML = "";

            let total = 0;


            if (cart.length === 0) {

                summary.innerHTML =
                    "<p>Your cart is empty.</p>";

                totalElement.innerText =
                    "Total: ₹0.00";

                return;
            }


            cart.forEach(product => {

                const itemTotal =
                    Number(product.price) *
                    product.quantity;

                total += itemTotal;


                const item =
                    document.createElement("div");

                item.className = "order-item";

                item.innerHTML = `

                    <div>

                        <div class="order-item-name">
                            ${product.name}
                        </div>

                        <div>
                            Quantity: ${product.quantity}
                        </div>

                    </div>

                    <div>
                        ₹${itemTotal.toFixed(2)}
                    </div>

                `;

                summary.appendChild(item);

            });


            totalElement.innerText =
                `Total: ₹${total.toFixed(2)}`;

        }


document
    .getElementById("checkout-form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const cart = getCart();

        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        const customerName =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const phone =
            document.getElementById("phone").value;

        const address =
            document.getElementById("address").value;

        const total = cart.reduce(
            (sum, product) =>
                sum + Number(product.price) * product.quantity,
            0
        );

        const orderData = {
            customer_name: customerName,
            email: email,
            phone: phone,
            address: address,
            total_amount: total,
            items: cart
        };

        try {

            const response = await fetch(
                "http://localhost:5000/api/orders",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(orderData)
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.message || "Failed to place order"
                );
            }

            alert(
                `Order placed successfully!\nOrder ID: ${result.orderId}`
            );

            localStorage.removeItem("cart");

            window.location.href = "index.html";

        } catch (error) {

            console.error("Checkout error:", error);

            alert(
                "Failed to place order. Please try again."
            );

        }

    });



        displayOrderSummary();

    </script>

</body>
</html>
