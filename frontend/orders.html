
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - CodeAlpha E-Commerce Store</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #f5f5f5;

            color: #333;

        }


        header {

            background-color: #222;

            color: white;

            padding: 20px;

            text-align: center;

        }


        header h1 {

            margin: 0 0 15px 0;

        }


        nav {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

            flex-wrap: wrap;

        }


        nav a {

            color: white;

            text-decoration: none;

            font-size: 16px;

        }


        nav a:hover {

            text-decoration: underline;

        }


        nav button {

            background-color: #e74c3c;

            color: white;

            border: none;

            padding: 8px 15px;

            border-radius: 5px;

            cursor: pointer;

        }


        nav button:hover {

            background-color: #c0392b;

        }


        main {

            max-width: 1000px;

            margin: 40px auto;

            padding: 20px;

        }


        h2 {

            text-align: center;

            margin-bottom: 30px;

        }


        #orders-container {

            display: flex;

            flex-direction: column;

            gap: 20px;

        }


        .order-card {

            background-color: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.1);

        }


        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

            padding-bottom: 15px;

            border-bottom: 1px solid #ddd;

        }


        .order-id {

            font-size: 18px;

            font-weight: bold;

        }


        .status {

            background-color: #27ae60;

            color: white;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 14px;

        }


        .order-details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

        }


        .detail {

            padding: 8px 0;

        }


        .detail strong {

            display: block;

            margin-bottom: 3px;

        }


        .total {

            margin-top: 20px;

            padding-top: 15px;

            border-top: 1px solid #ddd;

            text-align: right;

            font-size: 20px;

            font-weight: bold;

        }


        .message {

            text-align: center;

            background-color: white;

            padding: 30px;

            border-radius: 10px;

        }


        .error {

            color: #c0392b;

        }


        @media (max-width: 600px) {

            .order-details {

                grid-template-columns: 1fr;

            }


            .order-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 10px;

            }

        }

    </style>

</head>


<body>


    <header>

        <h1>
            CodeAlpha E-Commerce Store
        </h1>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <button onclick="logout()">
                Logout
            </button>

        </nav>

    </header>


    <main>

        <h2>
            My Orders
        </h2>


        <div id="orders-container">

            <div class="message">
                Loading orders...
            </div>

        </div>

    </main>


    <script>


        function logout() {

            localStorage.removeItem("user");

            localStorage.removeItem("cart");

            window.location.href =
                "login.html";

        }


        async function loadOrders() {

            const user =
                JSON.parse(
                    localStorage.getItem("user")
                );


            if (!user) {

                alert(
                    "Please login to view your orders."
                );

                window.location.href =
                    "login.html";

                return;

            }


            const container =
                document.getElementById(
                    "orders-container"
                );


            try {

                const response =
                    await fetch(
                        `http://localhost:5000/api/orders?email=${encodeURIComponent(user.email)}`
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load orders."
                    );

                }


                if (
                    !data.orders ||
                    data.orders.length === 0
                ) {

                    container.innerHTML = `

                        <div class="message">

                            <p>
                                You haven't placed
                                any orders yet.
                            </p>

                            <a href="products.html">
                                Browse Products
                            </a>

                        </div>

                    `;

                    return;

                }


                container.innerHTML = "";


                data.orders.forEach(order => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "order-card";


                    const date =
                        new Date(
                            order.created_at
                        ).toLocaleString();


                    card.innerHTML = `

                        <div class="order-header">

                            <div class="order-id">
                                Order #${order.id}
                            </div>

                            <div class="status">
                                ${order.status}
                            </div>

                        </div>


                        <div class="order-details">

                            <div class="detail">

                                <strong>
                                    Customer
                                </strong>

                                ${order.customer_name}

                            </div>


                            <div class="detail">

                                <strong>
                                    Date
                                </strong>

                                ${date}

                            </div>


                            <div class="detail">

                                <strong>
                                    Phone
                                </strong>

                                ${order.phone}

                            </div>


                            <div class="detail">

                                <strong>
                                    Address
                                </strong>

                                ${order.address}

                            </div>

                        </div>


                        <div class="total">

                            Total:
                            ₹${Number(
                                order.total_amount
                            ).toFixed(2)}

                        </div>

                    `;


                    container.appendChild(card);

                });


            } catch (error) {

                console.error(
                    "Orders error:",
                    error
                );


                container.innerHTML = `

                    <div class="message error">

                        <p>
                            Failed to load your orders.
                        </p>

                        <p>
                            Please make sure the
                            backend server is running.
                        </p>

                    </div>

                `;

            }

        }


        loadOrders();

    </script>


</body>

</html>
