<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home - CodeAlpha E-Commerce Store</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav {
            margin-top: 10px;
        }

        nav a,
        nav button {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        nav button {
            background: #c62828;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        nav button:hover {
            background: #a51f1f;
        }

        main {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        .welcome {
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .welcome h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .welcome p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .shop-button {
            display: inline-block;
            background: #222;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 5px;
        }

        .shop-button:hover {
            background: #444;
        }

    </style>

</head>

<body>

    <header>

        <h1>
            CodeAlpha E-Commerce Store
        </h1>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <button onclick="logout()">
                Logout
            </button>

        </nav>

    </header>


    <main>

        <div class="welcome">

            <h2 id="welcome-message">
                Welcome!
            </h2>

            <p>
                You are successfully logged in.
            </p>

            <a
                href="products.html"
                class="shop-button"
            >
                Browse Products
            </a>

        </div>

    </main>


    <script>

        // Check whether the user is logged in

        const user =
            JSON.parse(
                localStorage.getItem("user")
            );


        if (!user) {

            window.location.href =
                "login.html";

        }


        // Display user's name

        if (user) {

            document.getElementById(
                "welcome-message"
            ).innerText =
                `Welcome, ${user.name}!`;

        }


        // Logout function

        function logout() {

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }

    </script>

</body>

</html>
