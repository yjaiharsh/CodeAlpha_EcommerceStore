<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - CodeAlpha E-Commerce Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        #cart-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h3 {
            margin-bottom: 10px;
        }

        .cart-info p {
            margin-bottom: 8px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity button {
            width: 35px;
            height: 35px;
            border: none;
            background: #222;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .quantity span {
            font-weight: bold;
        }

        .remove-button {
            background: #c62828;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-button:hover {
            background: #a51f1f;
        }

        #empty-cart {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            display: none;
        }

        #cart-summary {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);

            text-align: right;
        }

        #cart-total {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .checkout-button {
            padding: 12px 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .checkout-button:hover {
            background: #444;
        }

        @media (max-width: 700px) {
            .cart-item {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>CodeAlpha E-Commerce Store</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="login.html">Login</a>
        </nav>

    </header>

    <main>

        <h2>Your Shopping Cart</h2>

        <div id="cart-container"></div>

        <div id="empty-cart">
            <h3>Your cart is empty.</h3>

            <p style="margin-top: 10px;">
                Add some products to your cart!
            </p>

            <a
                href="products.html"
                style="
                    display: inline-block;
                    margin-top: 20px;
                    background: #222;
                    color: white;
                    padding: 12px 20px;
                    border-radius: 5px;
                    text-decoration: none;
                "
            >
                Browse Products
            </a>
        </div>

        <div id="cart-summary">

            <div id="cart-total">
                Total: ₹0.00
            </div>

            <button
                class="checkout-button"
                onclick="checkout()"
            >
                Proceed to Checkout
            </button>

        </div>

    </main>

    <script>

        function getCart() {

            return JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        }


        function saveCart(cart) {

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

        }


        function displayCart() {

            const cart = getCart();

            const container =
                document.getElementById("cart-container");

            const emptyCart =
                document.getElementById("empty-cart");

            const summary =
                document.getElementById("cart-summary");

            const totalElement =
                document.getElementById("cart-total");


            container.innerHTML = "";


            if (cart.length === 0) {

                emptyCart.style.display = "block";

                summary.style.display = "none";

                return;
            }


            emptyCart.style.display = "none";

            summary.style.display = "block";


            let total = 0;


            cart.forEach((product, index) => {

                const itemTotal =
                    Number(product.price) * product.quantity;

                total += itemTotal;


                const item =
                    document.createElement("div");

                item.className = "cart-item";


                item.innerHTML = `

                    <img
                        src="images/${product.image}"
                        alt="${product.name}"
                    >

                    <div class="cart-info">

                        <h3>
                            ${product.name}
                        </h3>

                        <p>
                            Price: ₹${Number(product.price).toFixed(2)}
                        </p>

                        <p>
                            Subtotal: ₹${itemTotal.toFixed(2)}
                        </p>

                        <div class="quantity">

                            <button
                                onclick="decreaseQuantity(${index})"
                            >
                                -
                            </button>

                            <span>
                                ${product.quantity}
                            </span>

                            <button
                                onclick="increaseQuantity(${index})"
                            >
                                +
                            </button>

                        </div>

                    </div>

                    <button
                        class="remove-button"
                        onclick="removeItem(${index})"
                    >
                        Remove
                    </button>

                `;


                container.appendChild(item);

            });


            totalElement.innerText =
                `Total: ₹${total.toFixed(2)}`;

        }


        function increaseQuantity(index) {

            const cart = getCart();

            cart[index].quantity++;

            saveCart(cart);

            displayCart();

        }


        function decreaseQuantity(index) {

            const cart = getCart();

            if (cart[index].quantity > 1) {

                cart[index].quantity--;

            } else {

                cart.splice(index, 1);

            }

            saveCart(cart);

            displayCart();

        }


        function removeItem(index) {

            const cart = getCart();

            cart.splice(index, 1);

            saveCart(cart);

            displayCart();

        }


        function checkout() {

             window.location.href = "checkout.html";

        }


        displayCart();

    </script>

</body>
</html>
