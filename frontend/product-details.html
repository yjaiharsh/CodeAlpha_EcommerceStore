<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - CodeAlpha E-Commerce Store</title>
        
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        #loading {
            text-align: center;
            font-size: 18px;
        }

        #error {
            text-align: center;
            color: red;
            display: none;
        }

        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        .product-info h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .category {
            display: inline-block;
            background: #eee;
            padding: 7px 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .stock {
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #222;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .product-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>CodeAlpha E-Commerce Store</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>

        <p id="loading">Loading product...</p>

        <p id="error">
            Failed to load product.
        </p>

        <div id="product-container"></div>

        <a class="back-link" href="products.html">
            ← Back to Products
        </a>

    </main>

    <script>
    const productContainer =
        document.getElementById("product-container");

    const loading =
        document.getElementById("loading");

    const errorMessage =
        document.getElementById("error");

    let product = null;

    async function loadProduct() {

        try {

            const urlParams =
                new URLSearchParams(window.location.search);

            const productId =
                urlParams.get("id");

            if (!productId) {
                throw new Error("Product ID not found");
            }

            const response =
                await fetch(
                    `http://localhost:5000/api/products/${productId}`
                );

            if (!response.ok) {
                throw new Error("Product not found");
            }

            product =
                await response.json();

            loading.style.display = "none";

            productContainer.innerHTML = `
                <div class="product-details">

                    <div class="product-image">
                        <img
                            src="images/${product.image}"
                            alt="${product.name}"
                        >
                    </div>

                    <div class="product-info">

                        <h2>${product.name}</h2>

                        <p class="description">
                            ${product.description}
                        </p>

                        <p class="price">
                            ₹${product.price}
                        </p>

                        <span class="category">
                            ${product.category}
                        </span>

                        <p class="stock">
                            Stock Available: ${product.stock}
                        </p>

                        <button onclick="addToCart()">
                            Add to Cart
                        </button>

                    </div>

                </div>
            `;

        } catch (error) {

            console.error(error);

            loading.style.display = "none";
            errorMessage.style.display = "block";
        }
    }

    function addToCart() {

        const cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        const existingProduct =
            cart.find(item => item.id === product.id);

        if (existingProduct) {

            existingProduct.quantity++;

        } else {

            cart.push({
                id: product.id,
                name: product.name,
                description: product.description,
                price: product.price,
                category: product.category,
                image: product.image,
                stock: product.stock,
                quantity: 1
            });

        }

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        alert(`${product.name} added to cart!`);
    }

    loadProduct();
</script>

</body>
</html>
