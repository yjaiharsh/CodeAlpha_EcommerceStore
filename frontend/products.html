<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - CodeAlpha E-Commerce Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .product-card h3 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .category {
            display: inline-block;
            background: #eee;
            padding: 5px 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .stock {
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #loading {
            text-align: center;
            font-size: 18px;
        }

        #error {
            text-align: center;
            color: red;
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>CodeAlpha E-Commerce Store</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>

        <h2 class="page-title">Our Products</h2>

        <p id="loading">Loading products...</p>

        <p id="error">
            Failed to load products. Please try again.
        </p>

        <div id="products-container"></div>

    </main>

    <script>
        const productsContainer =
            document.getElementById("products-container");

        const loading =
            document.getElementById("loading");

        const errorMessage =
            document.getElementById("error");

        async function loadProducts() {

            try {

                const response =
                    await fetch("http://localhost:5000/api/products");

                if (!response.ok) {
                    throw new Error("Failed to fetch products");
                }

                const products =
                    await response.json();

                loading.style.display = "none";

                products.forEach(product => {

                    const productCard =
                        document.createElement("div");

                    productCard.className = "product-card";

                    productCard.innerHTML = `
                        <img src="images/${product.image}"
                             alt="${product.name}">

                        <h3>${product.name}</h3>

                        <p class="description">
                            ${product.description}
                        </p>

                        <p class="price">
                            ₹${product.price}
                        </p>

                        <span class="category">
                            ${product.category}
                        </span>

                        <p class="stock">
                            Stock: ${product.stock}
                        </p>

                        <button onclick="viewProduct(${product.id})">
                            View Product
                        </button>
                    `;

                    productsContainer.appendChild(productCard);
                });

            } catch (error) {

                console.error(error);

                loading.style.display = "none";
                errorMessage.style.display = "block";
            }
        }

        function viewProduct(productId) {
            window.location.href =
                `product-details.html?id=${productId}`;
        }

        loadProducts();
    </script>

</body>
</html>
