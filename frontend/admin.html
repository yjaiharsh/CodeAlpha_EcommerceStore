<div class="container">

    </div>


    <div class="stats">


        <div class="stat-card">

            <h3>

            <div

</div>

<div class="products-section">

            <h2>

            <button
                onclick="showAddProductForm()"
                class="add-product-button"
            >
                + Add Product
            </button>

        </div>


        <div id="product-form-container"></div>


        <div id="products-container">

            <div class="message">
                Loading products...
            </div>

        </div>

    </div>

<script>
    

    function logout() {

        localStorage.removeItem("user");

        localStorage.removeItem("cart");

        window.location.href =
            "login.html";

    }


    async function loadAdminOrders() {


        const user =
            JSON.parse(
                localStorage.getItem("user")
            );


        if (!user || user.role !== "admin") {

            alert(
                "Admin access required."
            );

            window.location.href =
                "index.html";

            return;

        }


        try {


            const response =
                await fetch(
                    "http://localhost:5000/api/orders/all",
                    {
                        headers: {
                            "x-user-role":
                                user.role
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to load orders."
                );

            }


            const orders =
                data.orders || [];


            const groupedOrders = {};


            orders.forEach(order => {


                if (
                    !groupedOrders[order.id]
                ) {

                    groupedOrders[order.id] = {

                        id:
                            order.id,

                        customer_name:
                            order.customer_name,

                        email:
                            order.email,

                        phone:
                            order.phone,

                        address:
                            order.address,

                        total_amount:
                            order.total_amount,

                        status:
                            order.status,

                        created_at:
                            order.created_at,

                        items: []

                    };

                }


                if (order.product_id) {

                    groupedOrders[
                        order.id
                    ].items.push({

                        product_name:
                            order.product_name,

                        price:
                            order.price,

                        quantity:
                            order.quantity,

                        subtotal:
                            order.subtotal

                    });

                }

            });


            const orderList =
                Object.values(
                    groupedOrders
                );


            document.getElementById(
                "total-orders"
            ).textContent =
                orderList.length;


            let totalSales = 0;

            let productsSold = 0;


            orderList.forEach(order => {

                totalSales +=
                    Number(
                        order.total_amount
                    );


                order.items.forEach(item => {

                    productsSold +=
                        Number(
                            item.quantity
                        );

                });

            });


            document.getElementById(
                "total-sales"
            ).textContent =
                `₹${totalSales.toFixed(2)}`;


            document.getElementById(
                "products-sold"
            ).textContent =
                productsSold;


            const container =
                document.getElementById(
                    "orders-container"
                );


            if (orderList.length === 0) {

                container.innerHTML = `

                    <div class="message">

                        No orders found.

                    </div>

                `;

                return;

            }


            container.innerHTML = "";


            orderList.forEach(order => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                const date =
                    new Date(
                        order.created_at
                    ).toLocaleString();


                let productsHTML = "";


                order.items.forEach(item => {

                    productsHTML += `

                        <div
                            class="order-product"
                        >

                            <div>

                                <div
                                    class="product-name"
                                >
                                    ${item.product_name}
                                </div>

                                <div
                                    class="product-info"
                                >
                                    Quantity:
                                    ${item.quantity}
                                    ×
                                    ₹${Number(
                                        item.price
                                    ).toFixed(2)}
                                </div>

                            </div>


                            <div>

                                ₹${Number(
                                    item.subtotal
                                ).toFixed(2)}

                            </div>

                        </div>

                    `;

                });


                card.innerHTML = `

                    <div
                        class="order-header"
                    >

                        <div
                            class="order-id"
                        >
                            Order #${order.id}
                        </div>

 <div>
    <select
        id="status-${order.id}"
        class="status-select"
    >
        <option value="Placed"
            ${order.status === "Placed" ? "selected" : ""}>
            Placed
        </option>

        <option value="Processing"
            ${order.status === "Processing" ? "selected" : ""}>
            Processing
        </option>

        <option value="Shipped"
            ${order.status === "Shipped" ? "selected" : ""}>
            Shipped
        </option>

        <option value="Delivered"
            ${order.status === "Delivered" ? "selected" : ""}>
            Delivered
        </option>
    </select>

    <button
        onclick="updateOrderStatus(${order.id})"
        class="update-status-button"
    >
        Update
    </button>
</div>

                    </div>


                    <div
                        class="customer-details"
                    >

                        <div
                            class="detail"
                        >

                            <strong>
                                Customer
                            </strong>

                            ${order.customer_name}

                        </div>


                        <div
                            class="detail"
                        >

                            <strong>
                                Email
                            </strong>

                            ${order.email}

                        </div>


                        <div
                            class="detail"
                        >

                            <strong>
                                Phone
                            </strong>

                            ${order.phone}

                        </div>


                        <div
                            class="detail"
                        >

                            <strong>
                                Address
                            </strong>

                            ${order.address}

                        </div>


                        <div
                            class="detail"
                        >

                            <strong>
                                Date
                            </strong>

                            ${date}

                        </div>

                    </div>


                    <h3
                        class="products-title"
                    >
                        Products
                    </h3>


                    <div>

                        ${productsHTML}

                    </div>


                    <div
                        class="order-total"
                    >

                        Total:
                        ₹${Number(
                            order.total_amount
                        ).toFixed(2)}

                    </div>

                `;


                container.appendChild(card);

            });


        } catch (error) {


            console.error(
                "Admin orders error:",
                error
            );


            document.getElementById(
                "orders-container"
            ).innerHTML = `

                <div
                    class="message error"
                >

                    Failed to load orders.

                </div>

            `;

        }

    }
     
    async function updateOrderStatus(orderId) {

    const user =
        JSON.parse(
            localStorage.getItem("user")
        );

    const statusSelect =
        document.getElementById(
            `status-${orderId}`
        );

    const status =
        statusSelect.value;


    try {

        const response =
            await fetch(
                "http://localhost:5000/api/orders/status",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "x-user-role":
                            user.role
                    },

                    body: JSON.stringify({
                        orderId: orderId,
                        status: status
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update order status."
            );

        }


        alert(
            `Order #${orderId} status updated to ${status}.`
        );

        loadAdminOrders();


    } catch (error) {

        console.error(
            "Update status error:",
            error
        );

        alert(
            "Failed to update order status."
        );

    }

}
   async function loadAdminProducts() {

    const container =
        document.getElementById(
            "products-container"
        );

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/products"
            );

        const products =
            await response.json();


        container.innerHTML = "";


        products.forEach(product => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            card.innerHTML = `

                <h3>
                    ${product.name}
                </h3>

                <p>
                    <strong>
                        Price:
                    </strong>
                    ₹${Number(
                        product.price
                    ).toFixed(2)}
                </p>

                <p>
                    <strong>
                        Category:
                    </strong>
                    ${product.category}
                </p>

                <p>
                    <strong>
                        Stock:
                    </strong>
                    ${product.stock}
                </p>

                <p>
                    ${product.description || ""}
                </p>


                <div class="product-actions">

                    <button
                        onclick="showEditProductForm(
                            ${product.id}
                        )"
                    >
                        Edit
                    </button>


                    <button
                        onclick="deleteProduct(
                            ${product.id}
                        )"
                    >
                        Delete
                    </button>

                </div>

            `;


            container.appendChild(card);

        });


    } catch (error) {

        console.error(
            "Load products error:",
            error
        );

        container.innerHTML = `
            <div class="message">
                Failed to load products.
            </div>
        `;

    }

}


function showAddProductForm() {

    const container =
        document.getElementById(
            "product-form-container"
        );


    container.innerHTML = `

        <div class="product-form">

            <h3>
                Add New Product
            </h3>


            <input
                id="product-name"
                placeholder="Product name"
            >


            <textarea
                id="product-description"
                placeholder="Description"
            ></textarea>


            <input
                id="product-price"
                type="number"
                step="0.01"
                placeholder="Price"
            >


            <input
                id="product-category"
                placeholder="Category"
            >


            <input
                id="product-image"
                placeholder="Image URL"
            >


            <input
                id="product-stock"
                type="number"
                placeholder="Stock"
            >


            <button
                onclick="createProduct()"
            >
                Create Product
            </button>


            <button
                onclick="cancelProductForm()"
            >
                Cancel
            </button>

        </div>

    `;

}


async function createProduct() {

    const user =
        JSON.parse(
            localStorage.getItem("user")
        );


    const productData = {

        name:
            document.getElementById(
                "product-name"
            ).value,

        description:
            document.getElementById(
                "product-description"
            ).value,

        price:
            document.getElementById(
                "product-price"
            ).value,

        category:
            document.getElementById(
                "product-category"
            ).value,

        image:
            document.getElementById(
                "product-image"
            ).value,

        stock:
            document.getElementById(
                "product-stock"
            ).value

    };


    try {

        const response =
            await fetch(
                "http://localhost:5000/api/products",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "x-user-role":
                            user.role

                    },

                    body:
                        JSON.stringify(
                            productData
                        )

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message
            );

        }


        alert(
            "Product created successfully!"
        );


        cancelProductForm();

        loadAdminProducts();


    } catch (error) {

        console.error(
            "Create product error:",
            error
        );

        alert(
            error.message ||
            "Failed to create product."
        );

    }

}


function cancelProductForm() {

    document.getElementById(
        "product-form-container"
    ).innerHTML = "";

}
async function showEditProductForm(productId) {

    const container =
        document.getElementById(
            "product-form-container"
        );

    try {

        const response =
            await fetch(
                `http://localhost:5000/api/products/${productId}`
            );

        const product =
            await response.json();

        if (!response.ok) {

            throw new Error(
                product.message ||
                "Failed to load product"
            );

        }


        container.innerHTML = `

            <div class="product-form">

                <h3>
                    Edit Product
                </h3>


                <input
                    id="edit-product-name"
                    value="${product.name}"
                    placeholder="Product name"
                >


                <textarea
                    id="edit-product-description"
                    placeholder="Description"
                >${product.description || ""}</textarea>


                <input
                    id="edit-product-price"
                    type="number"
                    step="0.01"
                    value="${product.price}"
                    placeholder="Price"
                >


                <input
                    id="edit-product-category"
                    value="${product.category}"
                    placeholder="Category"
                >


                <input
                    id="edit-product-image"
                    value="${product.image || ""}"
                    placeholder="Image URL"
                >


                <input
                    id="edit-product-stock"
                    type="number"
                    value="${product.stock || 0}"
                    placeholder="Stock"
                >


                <button
                    onclick="updateProduct(${product.id})"
                >
                    Update Product
                </button>


                <button
                    onclick="cancelProductForm()"
                >
                    Cancel
                </button>

            </div>

        `;

    } catch (error) {

        console.error(
            "Load product error:",
            error
        );

        alert(
            error.message ||
            "Failed to load product."
        );

    }

}


async function updateProduct(productId) {

    const user =
        JSON.parse(
            localStorage.getItem("user")
        );


    const productData = {

        name:
            document.getElementById(
                "edit-product-name"
            ).value,

        description:
            document.getElementById(
                "edit-product-description"
            ).value,

        price:
            document.getElementById(
                "edit-product-price"
            ).value,

        category:
            document.getElementById(
                "edit-product-category"
            ).value,

        image:
            document.getElementById(
                "edit-product-image"
            ).value,

        stock:
            document.getElementById(
                "edit-product-stock"
            ).value

    };


    try {

        const response =
            await fetch(
                `http://localhost:5000/api/products/${productId}`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "x-user-role":
                            user.role

                    },

                    body:
                        JSON.stringify(
                            productData
                        )

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to update product"
            );

        }


        alert(
            "Product updated successfully!"
        );


        cancelProductForm();

        loadAdminProducts();


    } catch (error) {

        console.error(
            "Update product error:",
            error
        );

        alert(
            error.message ||
            "Failed to update product."
        );

    }

}

async function deleteProduct(productId) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmed) {

        return;

    }


    const user =
        JSON.parse(
            localStorage.getItem("user")
        );


    try {

        const response =
            await fetch(
                `http://localhost:5000/api/products/${productId}`,
                {

                    method: "DELETE",

                    headers: {

                        "x-user-role":
                            user.role

                    }

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message
            );

        }


        alert(
            "Product deleted successfully!"
        );


        loadAdminProducts();


    } catch (error) {

        console.error(
            "Delete product error:",
            error
        );

        alert(
            error.message ||
            "Failed to delete product."
        );

    }

}
    loadAdminOrders();
    loadAdminProducts();

</script>


</body>

</html>
