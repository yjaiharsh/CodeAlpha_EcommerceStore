
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - CodeAlpha E-Commerce</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #f4f6f8;

            color: #222;

        }

        header {

            background-color: #222;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        header h1 {

            margin: 0;

            font-size: 24px;

        }

        .admin-label {

            font-size: 14px;

            opacity: 0.8;

        }

        .container {

            width: 90%;

            max-width: 1200px;

            margin: 30px auto;

        }

        .dashboard-title {

            margin-bottom: 25px;

        }

        .dashboard-title h2 {

            margin-bottom: 5px;

        }

        .dashboard-title p {

            color: #666;

        }

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;

        }

        .stat-card {

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);

        }

        .stat-card h3 {

            margin: 0 0 10px;

            color: #666;

            font-size: 15px;

        }

        .stat-card .value {

            font-size: 30px;

            font-weight: bold;

        }

        .orders-section {

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);

        }

        .orders-section h2 {

            margin-top: 0;

        }

        .order-card {

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 20px;

            margin-bottom: 20px;

        }

        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid #eee;

            padding-bottom: 12px;

            margin-bottom: 15px;

        }

        .order-id {

            font-size: 18px;

            font-weight: bold;

        }

        .status {

            background-color: #e8f5e9;

            color: #2e7d32;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 13px;

        }

        .customer-details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-bottom: 20px;

        }

        .detail {

            background-color: #f8f8f8;

            padding: 10px;

            border-radius: 5px;

        }

        .detail strong {

            display: block;

            margin-bottom: 4px;

            color: #555;

        }

        .products-title {

            margin-bottom: 10px;

        }

        .order-product {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px;

            background-color: #f8f8f8;

            border-radius: 6px;

            margin-bottom: 8px;

        }

        .product-name {

            font-weight: bold;

        }

        .product-info {

            color: #666;

            font-size: 14px;

            margin-top: 4px;

        }

        .order-total {

            text-align: right;

            font-size: 18px;

            font-weight: bold;

            margin-top: 15px;

        }

        .message {

            text-align: center;

            padding: 30px;

            color: #666;

        }

        .error {

            color: #c62828;

        }

        .logout-button {

            background-color: #e53935;

            color: white;

            border: none;

            padding: 9px 16px;

            border-radius: 5px;

            cursor: pointer;

        }

        .logout-button:hover {

            opacity: 0.9;

        }

        @media (max-width: 768px) {

            .stats {

                grid-template-columns: 1fr;

            }

            .customer-details {

                grid-template-columns: 1fr;

            }

            header {

                padding: 15px 20px;

            }

            .container {

                width: 94%;

            }

        }

    </style>

</head>


<body>


<header>

    <div>

        <h1>
            CodeAlpha E-Commerce
        </h1>

        <div class="admin-label">
            Admin Dashboard
        </div>

    </div>


    <button
        class="logout-button"
        onclick="logout()"
    >
        Logout
    </button>

</header>


<div class="container">


    <div class="dashboard-title">

        <h2>
            Dashboard
        </h2>

        <p>
            Manage and monitor customer orders.
        </p>

    </div>


    <div class="stats">


        <div class="stat-card">

            <h3>
                Total Orders
            </h3>

            <div
                class="value"
                id="total-orders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Total Sales
            </h3>

            <div
                class="value"
                id="total-sales"
            >
                ₹0.00
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Products Sold
            </h3>

            <div
                class="value"
                id="products-sold"
            >
                0
            </div>

        </div>


    </div>


    <div class="orders-section">

        <h2>
            All Orders
        </h2>

        <div id="orders-container">

            <div class="message">
                Loading orders...
            </div>

        </div>

    </div>


</div>


<script>


    function logout() {

        localStorage.removeItem("user");

        localStorage.removeItem("cart");

        window.location.href =
            "login.html";

    }


    async function loadAdminOrders() {


        const user =
            JSON.parse(
                localStorage.getItem("user")
            );


        if (!user || user.role !== "admin") {

            alert(
                "Admin access required."
            );

            window.location.href =
                "index.html";

            return;

        }


        try {


            const response =
                await fetch(
                    "http://localhost:5000/api/orders/all",
                    {
                        headers: {
                            "x-user-role":
                                user.role
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to load orders."
                );

            }


            const orders =
                data.orders || [];


            const groupedOrders = {};


            orders.forEach(order => {


                if (
                    !groupedOrders[order.id]
                ) {

                    groupedOrders[order.id] = {

                        id:
                            order.id,

                        customer_name:
                            order.customer_name,

                        email:
                            order.email,

                        phone:
                            order.phone,

                        address:
                            order.address,

                        total_amount:
                            order.total_amount,

                        status:
                            order.status,

                        created_at:
                            order.created_at,

                        items: []

                    };

                }


                if (order.product_id) {

                    groupedOrders[
                        order.id
                    ].items.push({

                        product_name:
                            order.product_name,

                        price:
                            order.price,

                        quantity:
                            order.quantity,

                        subtotal:
                            order.subtotal

                    });

                }

            });


            const orderList =
                Object.values(
                    groupedOrders
                );


            document.getElementById(
                "total-orders"
            ).textContent =
                orderList.length;


            let totalSales = 0;

            let productsSold = 0;


            orderList.forEach(order => {

                totalSales +=
                    Number(
                        order.total_amount
                    );


                order.items.forEach(item => {

                    productsSold +=
                        Number(
                            item.quantity
                        );

                });

            });


            document.getElementById(
                "total-sales"
            ).textContent =
                `₹${totalSales.toFixed(2)}`;


            document.getElementById(
                "products-sold"
            ).textContent =
                productsSold;


            const container =
                document.getElementById(
                    "orders-container"
                );


            if (orderList.length === 0) {

                container.innerHTML = `

                    <div class="message">

                        No orders found.

                    </div>

                `;

                return;

            }


            container.innerHTML = "";


            orderList.forEach(order => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                const date =
                    new Date(
                        order.created_at
                    ).toLocaleString();


                let productsHTML = "";


                order.items.forEach(item => {

                    productsHTML += `

                        <div
                            class="order-product"
                        >

                            <div>

                                <div
                                    class="product-name"
                                >
                                    ${item.product_name}
                                </div>

                                <div
                                    class="product-info"
                                >
                                    Quantity:
                                    ${item.quantity}
                                    ×
                                    ₹${Number(
                                        item.price
                                    ).toFixed(2)}
                                </div>

                            </div>


                            <div>

                                ₹${Number(
                                    item.subtotal
                                ).toFixed(2)}

                            </div>

                        </div>

                    `;

                });


                card.innerHTML = `

                    <div
                        class="order-header"
                    >

                        <div
                            class="order-id"
                        >
                            Order #${order.id}
                        </div>

                        <div
                            class="status"
                        >
                            ${order.status}
                        </div>

                    </div>


                    <div
                        class="customer-details"
                    >

                        <div
                            class="detail"
                        >

                            <strong>
                                Customer
                            </strong>

                            ${order.customer_name}

                        </div>


                        <div
                            class="detail"
                        >

                            <strong>
                                Email
                            </strong>

                            ${order.email}

                        </div>


                        <div
                            class="detail"
                        >

                            <strong>
                                Phone
                            </strong>

                            ${order.phone}

                        </div>


                        <div
                            class="detail"
                        >

                            <strong>
                                Address
                            </strong>

                            ${order.address}

                        </div>


                        <div
                            class="detail"
                        >

                            <strong>
                                Date
                            </strong>

                            ${date}

                        </div>

                    </div>


                    <h3
                        class="products-title"
                    >
                        Products
                    </h3>


                    <div>

                        ${productsHTML}

                    </div>


                    <div
                        class="order-total"
                    >

                        Total:
                        ₹${Number(
                            order.total_amount
                        ).toFixed(2)}

                    </div>

                `;


                container.appendChild(card);

            });


        } catch (error) {


            console.error(
                "Admin orders error:",
                error
            );


            document.getElementById(
                "orders-container"
            ).innerHTML = `

                <div
                    class="message error"
                >

                    Failed to load orders.

                </div>

            `;

        }

    }


    loadAdminOrders();


</script>


</body>

</html>
